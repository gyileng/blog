version: '3'

services:
  hexo-standalone:
    build: .
    container_name: blog
    network_mode: host  # 使用 Host 模式
    environment:
      - http_proxy=http://127.0.0.1:7890
      - https_proxy=http://127.0.0.1:7890
    volumes:
      - /var/services/homes/baiwei/documents/blog:/blog
      - /root/.ssh:/root/.ssh
    restart: always