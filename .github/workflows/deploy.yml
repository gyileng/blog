name: Deploy to NAS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host ssh.baiwei.site
            StrictHostKeyChecking no
            User baiwei
            IdentityFile ~/.ssh/id_rsa
          EOF

      - name: Deploy
        run: |
          ssh baiwei@ssh.baiwei.site << 'ENDSSH'
            set -e
            cd /var/services/homes/baiwei/documents/blog
            git pull
            sudo docker-compose restart
          ENDSSH
